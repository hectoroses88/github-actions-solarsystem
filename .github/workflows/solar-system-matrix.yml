name: Solar System Workflow Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    strategy:
      matrix:
        nodejs_version: [18, 19, 20]
        operating_system: [ubuntu-latest] #, macos-latest]
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest
    runs-on: ${{ matrix.operating_system }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM dependencies
        #https://docs.github.com/en/actions/concepts/workflows-and-actions/dependency-caching
        #https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
        #https://github.com/actions/cache
        uses: actions/cache@v6
        id: npm-cache 
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          #whenever the package-lock.json changes, we invalidate the caching
          #in the first run, there will be no cache

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: nodejs-unit-testing-step #we use this id in future conditions
        run: npm test
      
      - name: Archive Test Result
        #https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#steps-context
        #https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions
        #if: failure() && steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success'
        #the previous conditions indicates this step to execute when one of the previous steps failed but not to mark the previous step as successful as it happens with the continue-on-error option
        #similarly with always(), the unit testing step can fail 
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mocha-Test-Result
          path: test-results.xml

  code-coverage: 
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cache NPM dependencies
        uses: actions/cache@v6
        id: npm-cache 
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          #whenever the package-lock.json changes, we invalidate the caching
          #in the first run, there will be no cache

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        #https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepscontinue-on-error
        continue-on-error: true #with this, in case of an error, it still shows successfull
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Result
          path: coverage #the coverage folder
          retention-days: 5 #delete the artifact after 5 days
  docker:
    name: Containerization
    needs:  [unit-testing, code-coverage]
    permissions:
      packages: write #to publish packages in github packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Dockerhub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: GHCR Login
        uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }} #https://docs.github.com/en/actions/tutorials/authenticate-with-github_token
            
      #https://github.com/marketplace/actions/build-and-push-docker-images
      - name: Docker Build For Testing
        uses: docker/build-push-action@v4
        with:
          context: . #searches for the Dockerfile in the current directory
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }} #github.sha uses the commit id

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v4
        with:
          context: . 
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }} #github.sha uses the commit id
          #I can see my image in https://hub.docker.com/repositories/hectoroses88

      - name: Container Registry Push
        uses: docker/build-push-action@v4
        with:
          context: . 
          push: true
          tags: | 
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

